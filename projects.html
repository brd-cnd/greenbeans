<!DOCTYPE html>
<html lang="fr">
<head>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('greenbeans-theme');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
      try {
        var font = localStorage.getItem('greenbeans-font');
        if (font === 'dyslexic') {
          document.documentElement.setAttribute('data-font', 'dyslexic');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <title>greenbeans • projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/charte-graphique.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/site-header.js" defer></script>
  <script src="js/site-settings.js" defer></script>
  <script src="js/site-disclaimer.js" defer></script>
  <script src="js/site-search.js" defer></script>
</head>
<body>

  <site-header section="projects"></site-header>

  <main>
    <h1>Projets</h1>

    <h2>Projets professionnels</h2>
    <p>
      Réalisations effectuées lors de l'entreprise, ou bien dans le cadre de 
      travaux pratiques, devoirs et autres.
    </p>

    <h2>Projets personnels</h2>
    <p>
      Travaux initiés à titre personnel, à des fins de test et d'expérimentation.
    </p>
  </main>

  <site-settings></site-settings>

</body>
</html>
