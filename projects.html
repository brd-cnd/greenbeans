<!DOCTYPE html>
<html lang="fr">
<head>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('greenbeans-theme');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
      try {
        var font = localStorage.getItem('greenbeans-font');
        if (font === 'dyslexic') {
          document.documentElement.setAttribute('data-font', 'dyslexic');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <title>greenbeans • projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/charte-graphique.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/site-header.js" defer></script>
  <script src="js/site-settings.js" defer></script>
  <script src="js/site-search.js" defer></script>
</head>
<body>

  <!-- Page collectionArticles : Projets > Personnels > Divers. -->
  <site-header section="projects"></site-header>

  <main>
    <h1>Projets</h1>

    <h2>Projets professionnels</h2>
    <p>
      Retrouvez des comptes-rendus de réalisations professionnelles (entreprise) ou 
      des travaux pratiques, comme ceux du CNED.
    </p>

    <h2>Projets personnels</h2>
    <p>
      Un fourre-tout, où je mets par défaut ce qui n'est pas vraiment professionnel. 
    </p>
  </main>

  <site-settings></site-settings>

</body>
</html>
