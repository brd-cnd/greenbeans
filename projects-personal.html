<!DOCTYPE html>
<html lang="fr">
<head>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('greenbeans-theme');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
      try {
        var font = localStorage.getItem('greenbeans-font');
        if (font === 'dyslexic') {
          document.documentElement.setAttribute('data-font', 'dyslexic');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <title>greenbeans • projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/charte-graphique.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/site-header.js" defer></script>
  <script src="js/site-settings.js" defer></script>
  <script src="js/site-disclaimer.js" defer></script>
  <script src="js/site-articles.js" defer></script>
</head>
<body>

  <site-header section="projects" submenu="personal"></site-header>

  <main>
    <h1>Personnels</h1>

    <h2>Laboratoire</h2>
    <ul class="articlesList" data-list="laboratory"></ul>

    <h2>Divers</h2>
    <ul class="articlesList" data-list="misc"></ul>
  </main>

  <site-settings></site-settings>
</body>
</html>
